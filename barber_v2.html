<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Lucide Icons (CDN) -->

    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Outfit', sans-serif;
            background-image: radial-gradient(circle at top right, rgba(242, 201, 76, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones de las pantallas */
        .screen-enter { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .screen-exit { animation: slideOutLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutLeft {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-50%); }
        }

        /* Animación de despliegue progresivo interno */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down { animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Animación en cascada para las tarjetas */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="selection:bg-[#F2C94C] selection:text-black">

    <!-- ================= PANTALLA 1: SERVICIOS ================= -->

                <!-- Área Izquierda: Perfil / Usuario -->
                <div class="flex-1 flex justify-start z-10">
                    <button id="btn-profile" class="w-10 h-10 rounded-full bg-gradient-to-br from-[#F2C94C] to-[#d4af37] flex items-center justify-center text-black font-black text-lg shadow-lg hover:scale-105 transition-transform border border-[#F2C94C]/50">
                        U
                    </button>
                </div>

                <!-- Área Central: Logo y Nombre -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none gap-2 md:gap-3">
                    <img src="https://stbeunikpremproduction.blob.core.windows.net/avatar-pictures/f84928af-e75d-4c4e-9b9d-1e7b2d4a7520.png"

                    <!-- Se renderiza via JS con diseño de tarjetas con imágenes -->
                </div>
            </section>

                </div>

                </div>
                <div id="days-container" class="flex overflow-x-auto pb-4 gap-3 hide-scrollbar snap-x">
                    <!-- Se renderiza via JS -->
                </div>
            </section>

    <!-- ================= PANTALLA 3: MIS CITAS ================= -->

                <!-- Contraseña -->

                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">

                    </div>
                    <input type="password" id="profile-confirm" class="w-full bg-white/5 border border-white/10 focus:border-[#F2C94C] focus:bg-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-500 outline-none transition-all" placeholder="Confirmar Contraseña">
                </div>

                <!-- Botón Guardar -->
                <button type="submit" id="btn-save-profile" class="w-full mt-8 flex items-center justify-center gap-2 py-4 rounded-xl font-bold text-lg transition-all duration-300 bg-gradient-to-r from-[#F2C94C] to-[#d4af37] text-black shadow-[0_4px_20px_rgba(242,201,76,0.3)] hover:scale-[1.02]">
                    <span id="save-profile-text">Guardar Cambios</span>
                    <i data-lucide="save" id="save-profile-icon" class="w-5 h-5"></i>
                </button>
            </form>
        </main>
    </div>

        // --- 4. FUNCIONES DE RENDERIZADO ---
        function renderServices() {
            servicesContainer.innerHTML = '';
            SERVICES.forEach((service, index) => {
                const div = document.createElement('div');
                div.style.animationDelay = `${(index + 1) * 0.1}s`;
                div.className = 'animate-fade-up relative p-2.5 rounded-[2rem] cursor-pointer transition-all duration-300 border bg-gradient-to-br from-white/5 to-white/[0.01] border-white/10 hover:bg-white/10 hover:-translate-y-1.5 hover:border-[#F2C94C]/50 hover:shadow-[0_15px_40px_-15px_rgba(242,201,76,0.3)] backdrop-blur-md flex flex-col group';
                
                const badgeHtml = service.popular ? 
                    `<div class="absolute top-3 left-3 bg-gradient-to-r from-[#F2C94C] to-[#d4af37] text-black text-[0.6rem] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-lg shadow-black/50 z-20 flex items-center gap-1">
                        <i data-lucide="flame" class="w-3 h-3"></i> Top 1
                    </div>` : '';

                div.innerHTML = `
                    <div class="relative w-full h-44 md:h-52 rounded-[1.5rem] overflow-hidden mb-4 bg-gray-900">
                        ${badgeHtml}
                        <img src="${service.image}" alt="${service.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/40 to-transparent opacity-90"></div>
                        <div class="absolute bottom-3 right-3 bg-[#050505]/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 text-white font-black text-lg shadow-lg">
                            $${(service.price / 1000).toFixed(0)}k
                        </div>
                    </div>
                    <div class="px-3 pb-2 relative z-10 flex-1 flex flex-col">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="bg-[#F2C94C]/10 p-2 rounded-xl border border-[#F2C94C]/20 text-[#F2C94C] group-hover:scale-110 transition-transform">
                                <i data-lucide="${service.icon}" class="w-4 h-4"></i>
                            </div>
                            <h4 class="font-bold text-xl tracking-wide text-white group-hover:text-[#F2C94C] transition-colors">${service.name}</h4>
                        </div>
                        <p class="text-sm text-gray-400 leading-relaxed font-light line-clamp-2 mb-4">${service.desc}</p>
                        <div class="mt-auto flex items-center justify-between border-t border-white/5 pt-4 group-hover:border-white/10 transition-colors">
                            <span class="text-xs text-gray-500 font-medium group-hover:text-[#F2C94C] transition-colors">Toca para seleccionar</span>
                            <div class="bg-white/5 rounded-full p-2 group-hover:bg-[#F2C94C] group-hover:text-black transition-all duration-300 transform group-hover:-rotate-45">
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                `;
                
                div.onclick = () => {
                    state.selectedService = service;
                    headerServiceName.innerText = service.name;
                    openBookingScreen();
                };
                servicesContainer.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderBarbers() {
            barbersContainer.innerHTML = '';
            BARBERS.forEach(barber => {
                const isSelected = state.selectedBarber?.id === barber.id;
                const button = document.createElement('button');
                
                button.className = `snap-start shrink-0 flex flex-col items-center p-3 w-28 md:w-32 rounded-2xl transition-all border ${
                    isSelected
                        ? 'bg-gradient-to-b from-[#F2C94C]/20 to-transparent border-[#F2C94C] shadow-[0_0_15px_rgba(242,201,76,0.2)]'
                        : 'bg-white/5 border-white/5 hover:bg-white/10 hover:border-white/20'
                }`;
                
                button.innerHTML = `
                    <div class="relative w-16 h-16 md:w-20 md:h-20 mb-3">
                        <img src="${barber.img}" alt="${barber.name}" class="w-full h-full object-cover rounded-full border-2 ${isSelected ? 'border-[#F2C94C]' : 'border-transparent'}">
                        ${isSelected ? '<div class="absolute -bottom-1 -right-1 bg-[#F2C94C] rounded-full p-1"><i data-lucide="check" class="w-3 h-3 md:w-4 md:h-4 text-black"></i></div>' : ''}
                    </div>
                    <span class="font-bold text-sm md:text-base ${isSelected ? 'text-[#F2C94C]' : 'text-white'}">${barber.name}</span>
                    <span class="text-[0.65rem] md:text-xs text-gray-400 mt-0.5 uppercase tracking-wider">${barber.role}</span>
                `;
                
                button.onclick = () => {
                    state.selectedBarber = barber;
                    updateBookingUI();
                };
                barbersContainer.appendChild(button);
            });
        }

        function renderDays() {
            daysContainer.innerHTML = '';
            FEB_DAYS.forEach(day => {
                const isSelected = state.selectedDate === day.fullDate;
                const button = document.createElement('button');
                
                button.className = `snap-start shrink-0 flex flex-col items-center justify-center w-[4.5rem] md:w-20 h-24 md:h-28 rounded-2xl transition-all border ${
                    isSelected
                        ? 'bg-gradient-to-b from-[#F2C94C] to-[#d4af37] text-black border-[#F2C94C] shadow-[0_0_20px_rgba(242,201,76,0.3)]'
                        : 'bg-white/5 border-white/5 text-gray-400 hover:bg-white/10 hover:border-white/20 hover:text-white'
                }`;
                
                button.innerHTML = `
                    <span class="text-xs md:text-sm uppercase font-medium tracking-widest ${isSelected ? 'text-black/70' : ''}">${day.abbrev}</span>
                    <span class="text-3xl md:text-4xl font-black mt-1">${day.num}</span>
                `;
                
                button.onclick = () => {
                    if (state.selectedDate !== day.fullDate) {
                        state.selectedDate = day.fullDate;
                        checkAvailability(day.fullDate);
                    }
                };
                daysContainer.appendChild(button);
            });
        }

        function renderTimes() {
            timesContainer.innerHTML = '';

            if (state.error) {
                errorContainer.classList.remove('hidden');
                errorContainer.classList.add('flex');
                errorText.innerText = state.error;
            } else {
                errorContainer.classList.add('hidden');
                errorContainer.classList.remove('flex');
            }

            TIME_SLOTS.forEach(time => {
                const isOccupied = state.occupiedSlots.includes(time);
                const isSelected = state.selectedTime === time;
                const button = document.createElement('button');
                
                let baseClasses = 'py-3.5 rounded-xl text-sm font-semibold transition-all border tracking-wide ';
                if (isOccupied) {
                    baseClasses += 'bg-[#111] text-gray-700 border-transparent cursor-not-allowed';
                    button.disabled = true;
                    button.innerHTML = `<span class="line-through decoration-gray-700">${time}</span>`;
                } else if (isSelected) {
                    baseClasses += 'bg-[#F2C94C] text-black border-[#F2C94C] shadow-[0_0_15px_rgba(242,201,76,0.3)]';
                    button.innerText = time;
                } else {
                    baseClasses += 'bg-white/5 border-white/5 text-gray-300 hover:border-white/20 hover:bg-white/10';
                    button.innerText = time;
                }

                if (state.isLoading && !isOccupied) {
                    baseClasses += ' animate-pulse opacity-50 cursor-wait';
                    button.disabled = true;
                }

                button.className = baseClasses;
                
                if (!isOccupied && !state.isLoading) {
                    button.onclick = () => {
                        state.selectedTime = time;
                        updateBookingUI();
                    };
                }
                
                timesContainer.appendChild(button);
            });
        }

        // --- 5. LÓGICA DE NAVEGACIÓN UNIVERSAL ---
        
        function switchScreen(fromId, toId) {
            const fromScreen = document.getElementById(fromId);
            const toScreen = document.getElementById(toId);
            
            state.currentScreen = toId.replace('screen-', '');
            
            // Sincronización: Renderizar las citas cada vez que se abre la pantalla
            if (toId === 'screen-appointments') {
                renderAppointments();
            }
            
            fromScreen.classList.add('screen-exit');
            toScreen.classList.remove('hidden');
            toScreen.classList.add('screen-enter');
            
            setTimeout(() => {
                fromScreen.classList.add('hidden');
                fromScreen.classList.remove('screen-exit');
                toScreen.classList.remove('screen-enter');
            }, 400);
        }

        // Apertura específica de la reserva para limpiar estados
        function openBookingScreen() {
            switchScreen('screen-services', 'screen-booking');
            state.selectedBarber = null;
            state.selectedDate = null;
            state.selectedTime = null;
            updateBookingUI();
        }

        // Eventos de botones (Navegación principal)
        btnProfile.onclick = () => switchScreen('screen-services', 'screen-profile');
        btnAppointments.onclick = () => switchScreen('screen-services', 'screen-appointments');
        
        // Eventos de botones (Regresar)
        btnBackProfile.onclick = () => switchScreen('screen-profile', 'screen-services');
        btnBackAppointments.onclick = () => switchScreen('screen-appointments', 'screen-services');
        btnEmptyBook.onclick = () => switchScreen('screen-appointments', 'screen-services'); 
        
        btnBackBooking.onclick = () => {
            switchScreen('screen-booking', 'screen-services');
            // Limpieza visual tras la animación de salida
            setTimeout(() => {
                stepDate.classList.add('hidden');
                stepTime.classList.add('hidden');
                bookingFooter.classList.remove('translate-y-0');
                bookingFooter.classList.add('translate-y-full');
            }, 400);
        };

        // Eventos de Pestañas (Tabs) en Mis Citas
        tabUpcoming.onclick = () => {
            currentAptTab = 'upcoming';
            tabUpcoming.classList.add('bg-[#F2C94C]', 'text-black', 'shadow-[0_2px_10px_rgba(242,201,76,0.3)]');
            tabUpcoming.classList.remove('text-gray-400', 'hover:text-white');
            tabHistory.classList.remove('bg-[#F2C94C]', 'text-black', 'shadow-[0_2px_10px_rgba(242,201,76,0.3)]');
            tabHistory.classList.add('text-gray-400', 'hover:text-white');
            renderAppointments();
        };

        tabHistory.onclick = () => {
            currentAptTab = 'history';
            tabHistory.classList.add('bg-[#F2C94C]', 'text-black', 'shadow-[0_2px_10px_rgba(242,201,76,0.3)]');
            tabHistory.classList.remove('text-gray-400', 'hover:text-white');
            tabUpcoming.classList.remove('bg-[#F2C94C]', 'text-black', 'shadow-[0_2px_10px_rgba(242,201,76,0.3)]');
            tabUpcoming.classList.add('text-gray-400', 'hover:text-white');
            renderAppointments();
        };

        // Lógica Principal de Renderizado y Filtrado
        function renderAppointments() {
            const savedData = localStorage.getItem('levelBarberAppointments');
            const appointments = savedData ? JSON.parse(savedData) : [];
            
            // Generar fecha base de hoy para comparación
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Filtrar según el tab actual
            const filtered = appointments.filter(apt => {
                const [year, month, day] = apt.date.split('-');
                const aptDate = new Date(year, month - 1, day);
                return currentAptTab === 'upcoming' ? (aptDate >= today) : (aptDate < today);
            });

            // Ordenar: Futuras (más próximas primero), Historial (más recientes primero)
            filtered.sort((a, b) => {
                const dateA = new Date(a.date.split('-')[0], a.date.split('-')[1] - 1, a.date.split('-')[2]);
                const dateB = new Date(b.date.split('-')[0], b.date.split('-')[1] - 1, b.date.split('-')[2]);
                return currentAptTab === 'upcoming' ? dateA - dateB : dateB - dateA;
            });

            appointmentsList.innerHTML = '';

            if (filtered.length === 0) {
                appointmentsList.classList.add('hidden');
                appointmentsEmpty.classList.remove('hidden');
                emptyStateText.innerText = currentAptTab === 'upcoming' 
                    ? 'Aún no tienes reservas programadas para el futuro.' 
                    : 'No tienes historial de citas pasadas.';
            } else {
                appointmentsList.classList.remove('hidden');
                appointmentsEmpty.classList.add('hidden');

                // Renderizar Tarjetas Premium
                filtered.forEach((apt, index) => {
                    const card = document.createElement('div');
                    card.className = 'animate-fade-up bg-white/5 border border-white/10 rounded-[1.5rem] p-5 flex flex-col gap-4 relative overflow-hidden backdrop-blur-sm hover:border-white/20 transition-colors';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    const statusColor = currentAptTab === 'upcoming' ? 'bg-gradient-to-b from-[#F2C94C] to-[#d4af37]' : 'bg-gradient-to-b from-gray-500 to-gray-700';
                    const glowClass = currentAptTab === 'upcoming' ? 'shadow-[0_0_15px_rgba(242,201,76,0.3)]' : '';
                    const badgeClass = currentAptTab === 'upcoming' ? 'bg-[#F2C94C]/10 text-[#F2C94C] border border-[#F2C94C]/20' : 'bg-white/5 text-gray-400 border border-white/10';
                    const statusText = currentAptTab === 'upcoming' ? 'Agendada' : 'Completada';

                    card.innerHTML = `
                        <div class="absolute top-0 left-0 w-1.5 h-full ${statusColor} ${glowClass}"></div>
                        <div class="flex justify-between items-start pl-2">
                            <div>
                                <h4 class="font-bold text-lg md:text-xl text-white tracking-wide">${apt.service.name}</h4>
                                <div class="flex items-center gap-2 mt-1.5">
                                    <img src="${apt.barber.img}" class="w-6 h-6 rounded-full border border-white/20 object-cover">
                                    <span class="text-sm text-gray-400 font-medium">con ${apt.barber.name}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-[0.65rem] font-bold px-3 py-1.5 rounded-lg ${badgeClass} uppercase tracking-wider">${statusText}</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-4 md:gap-6 text-sm mt-2 border-t border-white/5 pt-4 pl-2">
                            <div class="flex items-center gap-2">
                                <div class="bg-[#F2C94C]/10 p-1.5 rounded-md text-[#F2C94C]">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                </div>
                                <span class="text-gray-200 font-medium">${apt.date}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="bg-[#F2C94C]/10 p-1.5 rounded-md text-[#F2C94C]">
                                    <i data-lucide="clock" class="w-4 h-4"></i>
                                </div>
                                <span class="text-gray-200 font-medium">${apt.time}</span>
                            </div>
                        </div>
                    `;
                    appointmentsList.appendChild(card);
                });
                lucide.createIcons();
            }
        }

        // --- RESTO DE FUNCIONES (Reserva y Whatsapp) ---
        function updateBookingUI() {
            renderBarbers();
            renderDays();
            renderTimes();

            if (state.selectedBarber && stepDate.classList.contains('hidden')) {
                stepDate.classList.remove('hidden');
                stepDate.classList.add('animate-slide-down');
                setTimeout(() => stepDate.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
            }

            if (state.selectedDate && stepTime.classList.contains('hidden')) {
                stepTime.classList.remove('hidden');
                stepTime.classList.add('animate-slide-down');
                setTimeout(() => stepTime.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
            }

            if (state.selectedBarber && state.selectedDate && state.selectedTime) {
                bookingFooter.classList.remove('translate-y-full');
                bookingFooter.classList.add('translate-y-0');
                submitText.innerText = `Agendar con ${state.selectedBarber.name}`;
            } else {
                bookingFooter.classList.remove('translate-y-0');
                bookingFooter.classList.add('translate-y-full');
            }

            lucide.createIcons();
        }

        async function checkAvailability(date) {
            state.isLoading = true;
            state.error = null;
            state.selectedTime = null;
            state.occupiedSlots = [];
            updateBookingUI(); 

            try {
                await new Promise(resolve => setTimeout(resolve, 600));

                const dayNum = parseInt(date.split('-')[2]);
                const barberId = state.selectedBarber.id;
                
                if ((dayNum + barberId) % 2 === 0) {
                    state.occupiedSlots = ['10:00 AM', '01:00 PM', '05:00 PM', '06:00 PM'];
                } else {
                    state.occupiedSlots = ['11:00 AM', '12:00 PM', '04:00 PM', '07:00 PM'];
                }

            } catch (err) {
                state.error = 'Error cargando horarios. Intenta de nuevo.';
            } finally {
                state.isLoading = false;
                updateBookingUI(); 
            }
        }

        // --- Función auxiliar para alertas elegantes (Toast) ---
        function showToast(message, type = 'error') {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl backdrop-blur-md z-[100] transition-all duration-300 flex items-center gap-3 border opacity-0 -translate-y-4';
            
            if (type === 'error') {
                toast.classList.add('bg-red-500/10', 'text-red-400', 'border-red-500/20');
                toast.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5"></i><span class="font-medium text-sm">${message}</span>`;
            } else {
                toast.classList.add('bg-[#F2C94C]/10', 'text-[#F2C94C]', 'border-[#F2C94C]/20');
                toast.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i><span class="font-medium text-sm">${message}</span>`;
            }

            document.body.appendChild(toast);
            lucide.createIcons({ root: toast });

            // Animar entrada suave
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', '-translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
            });

            // Remover después de 2.5 segundos
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        submitBtn.onclick = () => {
            if (!state.selectedDate || !state.selectedTime || !state.selectedService || !state.selectedBarber) return;

            // 1. Intercepción: Validar si el perfil existe
            const savedProfile = localStorage.getItem('levelBarberProfile');
            
            if (!savedProfile) {
                // No hay perfil: Mostrar aviso y redirigir
                showToast('Por favor completa tu perfil para reservar', 'error');
                
                setTimeout(() => {
                    switchScreen('screen-booking', 'screen-profile');
                    // Enfocar el primer input para invitar a escribir
                    setTimeout(() => document.getElementById('profile-name').focus(), 500);
                }, 1500);
                return;
            }

            // 2. Si hay perfil: Proceder a guardar la cita localmente
            const profileData = JSON.parse(savedProfile);
            
            const newAppointment = {
                id: Date.now().toString(),
                service: state.selectedService,
                barber: state.selectedBarber,
                date: state.selectedDate,
                time: state.selectedTime,
                status: 'Pendiente' 
            };

            // Traer citas previas y agregar la nueva
            const existingAppointments = JSON.parse(localStorage.getItem('levelBarberAppointments') || '[]');
            existingAppointments.push(newAppointment);
            localStorage.setItem('levelBarberAppointments', JSON.stringify(existingAppointments));

            // Feedback visual en el botón de confirmación
            const originalText = submitText.innerText;
            submitBtn.classList.remove('from-[#F2C94C]', 'to-[#d4af37]', 'text-black');
            submitBtn.classList.add('bg-[#22c55e]', 'text-white'); // Verde éxito
            submitBtn.style.background = '#22c55e';
            submitText.innerText = '¡Reserva Guardada!';
            
            const formatPrice = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(state.selectedService.price);

            // 3. Preparar mensaje de WhatsApp (Ahora incluye el nombre del cliente)
            const message = `¡Hola! Soy *${profileData.name}*. Quiero agendar una cita en LEVEL VIP Barber Shop.%0A%0A*Detalles de la reserva:*%0A✂️ Servicio: ${state.selectedService.name}%0A🧔🏻‍♂️ Barbero: ${state.selectedBarber.name}%0A📅 Fecha: ${state.selectedDate}%0A⏰ Hora: ${state.selectedTime}%0A💰 Valor: ${formatPrice}%0A%0A¿Me confirman mi cita?`;
            
            // 4. Abrir WhatsApp tras un breve delay visual
            setTimeout(() => {
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
                
                // Limpiar la pantalla de reserva y enviar a "Mis Citas" de forma silenciosa de fondo
                setTimeout(() => {
                    switchScreen('screen-booking', 'screen-appointments');
                    
                    // Restaurar botón de reserva a su estado original para el futuro
                    submitBtn.style.background = '';
                    submitBtn.classList.add('from-[#F2C94C]', 'to-[#d4af37]', 'text-black');
                    submitBtn.classList.remove('bg-[#22c55e]', 'text-white');
                    submitText.innerText = originalText;
                }, 500);
            }, 1000);
        };

        // --- 6. LÓGICA DEL PERFIL (LOCALSTORAGE Y EFECTOS) ---
        function loadProfile() {
            const savedData = localStorage.getItem('levelBarberProfile');
            if (savedData) {
                const profile = JSON.parse(savedData);
                inputName.value = profile.name || '';
                inputEmail.value = profile.email || '';
                inputPhone.value = profile.phone || '';
                
                // Actualizar avatares si hay nombre
                if (profile.name) {
                    const initial = profile.name.charAt(0).toUpperCase();
                    btnProfile.innerText = initial;
                    profileAvatarLarge.innerText = initial;
                    profileDisplayName.innerText = profile.name;
                }
            }
        }

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            profileError.classList.add('hidden');
            profileError.classList.remove('flex');
            
            // Validación de contraseñas
            if (inputPassword.value || inputConfirm.value) {
                if (inputPassword.value !== inputConfirm.value) {
                    profileErrorText.innerText = 'Las contraseñas no coinciden. Verifícalas.';
                    profileError.classList.remove('hidden');
                    profileError.classList.add('flex');
                    return;
                }
            }

            // Guardar datos
            const profileData = {
                name: inputName.value.trim(),
                email: inputEmail.value.trim(),
                phone: inputPhone.value.trim()
            };

            localStorage.setItem('levelBarberProfile', JSON.stringify(profileData));

            // Efecto Espejo instantáneo
            const initial = profileData.name ? profileData.name.charAt(0).toUpperCase() : 'U';
            btnProfile.innerText = initial;
            profileAvatarLarge.innerText = initial;
            profileDisplayName.innerText = profileData.name || 'Usuario Invitado';

            // Animación de Éxito en el Botón
            const originalText = saveProfileText.innerText;
            
            // Cambiamos el estilo a modo "Éxito"
            btnSaveProfile.classList.remove('from-[#F2C94C]', 'to-[#d4af37]', 'text-black');
            btnSaveProfile.style.background = '#22c55e'; // Verde Tailwind
            btnSaveProfile.classList.add('text-white');
            saveProfileText.innerText = '¡Perfil Guardado!';
            saveProfileIcon.setAttribute('data-lucide', 'check-circle');
            lucide.createIcons();

            // Revertir el botón a su estado normal después de 2 segundos
            setTimeout(() => {
                btnSaveProfile.style.background = '';
                btnSaveProfile.classList.add('from-[#F2C94C]', 'to-[#d4af37]', 'text-black');
                btnSaveProfile.classList.remove('text-white');
                saveProfileText.innerText = originalText;
                saveProfileIcon.setAttribute('data-lucide', 'save');
                inputPassword.value = ''; // Limpiar campos de contraseña tras guardar
                inputConfirm.value = '';
                lucide.createIcons();
            }, 2500);
        });

        // --- INICIALIZACIÓN ---
        renderServices();
        loadProfile(); // Cargar perfil guardado al abrir la app
        lucide.createIcons(); // Crear iconos estáticos iniciales

    </script>
</body>
</html>
